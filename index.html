<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dental Practice Directory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--plum:#893277;--plum-dark:#64215d;--pale:#f5edf4;--ink:#29272a;--muted:#656166;--line:#e4e0e4;--bg:#f7f6f7;--green:#24704b;--blue:#205d83;--amber:#946100}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Open Sans",Arial,sans-serif}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    .shell{min-height:100vh;display:grid;grid-template-columns:230px 1fr}
    aside{background:#fff;border-right:1px solid var(--line);padding:24px 15px;display:flex;flex-direction:column;gap:28px}
    .brand{display:flex;align-items:center;gap:10px;padding:0 8px;font-weight:700}
    .brandmark{width:36px;height:36px;border-radius:9px;background:var(--plum);color:#fff;display:grid;place-items:center;font-size:14px}
    .nav{display:grid;gap:5px}
    .nav button{border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:8px;color:#403b40}
    .nav button.active,.nav button:hover{background:var(--pale);color:var(--plum-dark);font-weight:700}
    .nav-label{padding:0 12px 7px;color:#79747a;text-transform:uppercase;letter-spacing:.08em;font-size:10px;font-weight:700}
    .userbox{margin-top:auto;border:1px solid var(--line);background:#faf8fa;border-radius:8px;padding:10px;font-size:11px;color:var(--muted);overflow-wrap:anywhere}
    .userbox strong{color:var(--ink);display:block;font-size:12px;margin-bottom:2px}
    main{min-width:0}
    .topbar{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 26px;color:var(--muted);font-size:12px}
    .content{padding:25px 26px;max-width:1500px;margin:auto}
    .heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
    .heading h1{font-size:25px;margin:0;letter-spacing:-.03em}
    .button{border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);padding:8px 11px;font-size:12px;font-weight:700}
    .button.primary{background:var(--plum);border-color:var(--plum);color:#fff}
    .button.danger{color:#9b3434;border-color:#e5c9c9}
    .button:hover{filter:brightness(.97)}
    .button.small{padding:5px 8px;font-size:11px}
    .filters{display:grid;grid-template-columns:minmax(220px,2fr) repeat(3,minmax(130px,1fr)) auto;gap:8px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:12px;margin-bottom:13px}
    .field{width:100%;border:1px solid #d7d2d7;border-radius:6px;padding:8px 9px;background:#fff;color:#343034;font-size:12px}
    .search{position:relative}
    .search input{padding-left:29px}
    .search span{position:absolute;left:10px;top:7px;color:#777}
    .meta{display:flex;justify-content:space-between;align-items:center;margin:10px 2px;color:var(--muted);font-size:11px}
    .workspace{display:grid;grid-template-columns:minmax(450px,1.25fr) minmax(330px,.9fr);gap:13px;align-items:start}
    .panel{background:#fff;border:1px solid var(--line);border-radius:9px;overflow:hidden}
    .panel-head{padding:13px 15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
    .panel-head h2{font-size:14px;margin:0}
    .records{max-height:calc(100vh - 290px);min-height:220px;overflow:auto}
    .record{padding:13px 15px;border-bottom:1px solid #efedef;cursor:pointer}
    .record:hover,.record.selected{background:#fcf8fb}
    .record.selected{box-shadow:inset 3px 0 var(--plum)}
    .record-top{display:flex;justify-content:space-between;gap:8px}
    .record h3{margin:0;font-size:13px}
    .record .address{font-size:11px;color:var(--muted);margin-top:3px}
    .badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
    .badge{border-radius:20px;padding:3px 7px;font-size:10px;font-weight:700;background:#f0eef0;color:#4f4a4f}
    .email-count{font-size:10px;color:var(--muted);white-space:nowrap}
    .empty{padding:28px;text-align:center;color:var(--muted);font-size:12px}
    .pager{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
    .detail{padding:16px}
    .detail-title{display:flex;justify-content:space-between;gap:10px}
    .detail-title h2{font-size:16px;margin:0}
    .detail-title p{font-size:11px;color:var(--muted);margin:4px 0 0}
    .divider{height:1px;background:var(--line);margin:14px 0}
    .section-title{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#625d63;font-weight:700;margin:0 0 9px}
    .data{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .data-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
    .data-value{font-size:11px;margin-top:3px;overflow-wrap:anywhere}
    .data-value a,.email-link,.activity-link{color:var(--plum-dark)}
    .contacts{display:grid;gap:7px}
    .contact{border:1px solid var(--line);border-radius:7px;padding:9px}
    .contact-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
    .contact-role{font-size:11px;font-weight:700}
    .contact-actions{display:flex;gap:4px}
    .email-link{display:block;font-size:11px;text-decoration:none;margin-top:4px;overflow-wrap:anywhere}
    .email-link:hover{text-decoration:underline}
    .contact-note,.source{font-size:10px;color:var(--muted);margin-top:4px}
    .activity{display:grid;gap:10px}
    .activity-item{display:grid;grid-template-columns:24px 1fr;gap:8px;align-items:start}
    .avatar{height:23px;width:23px;border-radius:50%;display:grid;place-items:center;background:#ead9e8;color:var(--plum-dark);font-size:9px;font-weight:bold}
    .activity-copy{font-size:10px;line-height:1.4;overflow-wrap:anywhere}
    .activity-copy small{display:block;color:var(--muted);margin-top:2px}
    .notice{padding:12px;color:#6a2a2a;background:#fff3f3;border-bottom:1px solid #efd4d4;font-size:12px;display:none}
    .notice.show{display:block}
    .modal-backdrop{position:fixed;inset:0;background:#21142175;display:none;align-items:center;justify-content:center;padding:16px;z-index:5}
    .modal-backdrop.open{display:flex}
    .modal{background:#fff;border-radius:10px;width:min(460px,100%);box-shadow:0 18px 60px #21142140;overflow:hidden}
    .modal-head{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
    .modal-head h2{font-size:15px;margin:0}
    .close{border:0;background:transparent;font-size:22px;color:#615b61}
    .modal-body{padding:16px 18px;display:grid;gap:10px}
    .form-row label{display:block;font-size:11px;font-weight:700;margin-bottom:4px}
    .form-row input,.form-row select,.form-row textarea{width:100%;border:1px solid #d7d2d7;border-radius:6px;padding:8px;font-size:12px}
    .form-row textarea{min-height:55px;resize:vertical}
    .modal-actions{padding:0 18px 16px;display:flex;justify-content:flex-end;gap:7px}
    .toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#282328;color:#fff;padding:8px 13px;border-radius:7px;font-size:11px;opacity:0;pointer-events:none;transition:opacity .2s}
    .toast.show{opacity:1}
    @media(max-width:1000px){.workspace{grid-template-columns:1fr}.records{max-height:360px}}
    @media(max-width:700px){.shell{grid-template-columns:1fr}aside{display:none}.topbar{height:53px;padding:0 14px}.content{padding:17px 12px}.heading h1{font-size:21px}.filters{grid-template-columns:1fr 1fr}.search{grid-column:1/-1}.workspace{grid-template-columns:1fr}.records{max-height:330px}}
  </style>
</head>
<body>
<div class="shell">
  <aside>
    <div class="brand"><div class="brandmark">PD</div><span>Practice Directory</span></div>
    <div>
      <div class="nav-label">Directory</div>
      <nav class="nav">
        <button class="active" id="directoryTab">⌕ &nbsp; Practices</button>
        <button id="activityTab">◷ &nbsp; Team activity</button>
      </nav>
    </div>
    <div class="userbox"><strong>Signed in</strong><span id="currentUser">Loading…</span></div>
  </aside>
  <main>
    <header class="topbar"><span>England</span><span id="headerUser"></span></header>
    <div class="content">
      <div class="heading">
        <h1 id="pageTitle">Dental practices</h1>
        <button class="button primary" id="addTop" disabled>＋ Add email</button>
      </div>
      <div id="notice" class="notice" role="alert"></div>
      <section id="directoryView">
        <div class="filters">
          <div class="search"><span>⌕</span><input class="field" id="q" placeholder="Practice name or postcode" aria-label="Search practice name or postcode"></div>
          <select class="field" id="region">
            <option value="">All regions</option><option>East of England</option><option>London</option><option>Midlands</option><option>North East and Yorkshire</option><option>North West</option><option>South East</option><option>South West</option>
          </select>
          <input class="field" id="localAuthority" placeholder="Local authority" aria-label="Filter by local authority">
          <select class="field" id="emailFilter">
            <option value="">Any email status</option><option value="has">Has email</option><option value="missing">No email</option>
          </select>
          <button class="button" id="clearFilters">Clear</button>
        </div>
        <div class="meta"><span id="resultCount">Loading practices…</span><button class="button small" id="exportBtn">Export CSV</button></div>
        <div class="workspace">
          <section class="panel">
            <div class="panel-head"><h2>Practices</h2><span id="pageCount" style="font-size:10px;color:var(--muted)"></span></div>
            <div class="records" id="records"><div class="empty">Loading CQC records…</div></div>
            <div class="pager"><button class="button small" id="prevPage">Previous</button><span id="pageLabel" style="font-size:10px;color:var(--muted)"></span><button class="button small" id="nextPage">Next</button></div>
          </section>
          <section class="panel" id="detail"><div class="empty">Select a practice to view its contacts.</div></section>
        </div>
      </section>
      <section id="activityView" hidden>
        <div class="panel"><div class="panel-head"><h2>Team activity</h2></div><div class="activity" id="activityList" style="padding:15px"><div class="empty">Loading activity…</div></div></div>
      </section>
      <footer style="padding:13px 2px;color:var(--muted);font-size:10px">CQC data from the <a href="https://www.cqc.org.uk/about-us/transparency/using-cqc-data" target="_blank" rel="noreferrer" style="color:var(--plum-dark)">Care Quality Commission</a>.</footer>
    </div>
  </main>
</div>

<div class="modal-backdrop" id="backdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal">
    <div class="modal-head"><h2 id="modalTitle">Add email contact</h2><button class="close" id="closeModal" aria-label="Close">×</button></div>
    <form id="contactForm">
      <div class="modal-body">
        <input type="hidden" id="contactId">
        <div class="form-row"><label for="email">Email address</label><input id="email" type="email" required></div>
        <div class="form-row"><label for="role">Contact type</label><select id="role"><option>Reception</option><option>Practice manager</option><option>Recruitment</option><option>General enquiries</option><option>Other</option></select></div>
        <div class="form-row"><label for="source">Source</label><input id="source" required placeholder="Practice website, email reply…"></div>
        <div class="form-row"><label for="note">Note</label><textarea id="note"></textarea></div>
      </div>
      <div class="modal-actions"><button type="button" class="button" id="cancelModal">Cancel</button><button class="button primary" type="submit">Save</button></div>
    </form>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const state={rows:[],selected:null,page:1,total:0,perPage:25,view:"directory",timer:null};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function showError(message){const n=$("notice");n.textContent=message;n.classList.add("show")}
function clearError(){$("notice").classList.remove("show")}

async function api(url,options={}){
  const response=await fetch(url,{...options,headers:{"Content-Type":"application/json",...(options.headers||{})}});
  const data=await response.json().catch(()=>({}));
  if(!response.ok)throw new Error(data.error||`Request failed (${response.status})`);
  return data;
}

async function loadUser(){
  try{
    const me=await api("/api/me");
    $("currentUser").textContent=me.email;
    $("headerUser").textContent=me.email;
  }catch(e){showError(e.message)}
}

function badge(value){return value?`<span class="badge">${esc(value)}</span>`:""}

function params(){
  const p=new URLSearchParams({page:state.page,perPage:state.perPage});
  for(const [key,id] of [["q","q"],["region","region"],["localAuthority","localAuthority"]]){
    if($(id).value.trim())p.set(key,$(id).value.trim());
  }
  if($("emailFilter").value)p.set("email",$("emailFilter").value);
  return p;
}

async function loadPractices(){
  clearError();
  $("records").innerHTML='<div class="empty">Loading CQC records…</div>';
  try{
    const data=await api(`/api/practices?${params()}`);
    state.rows=data.practices||[];
    state.total=data.total||0;
    if(state.selected){
      state.selected=state.rows.find(p=>p.id===state.selected.id)||null;
      if(!state.selected)$("addTop").disabled=true;
    }
    $("resultCount").textContent=`${state.total.toLocaleString()} practices`;
    const pages=Math.max(1,Math.ceil(state.total/state.perPage));
    $("pageCount").textContent=`Page ${state.page} of ${pages}`;
    $("pageLabel").textContent=`${state.page} / ${pages}`;
    $("prevPage").disabled=state.page<=1;
    $("nextPage").disabled=state.page>=pages;
    renderRows();
    renderDetail();
  }catch(e){
    state.rows=[];
    $("records").innerHTML='<div class="empty">CQC records could not be loaded.</div>';
    showError(e.message);
  }
}

function renderRows(){
  if(!state.rows.length){
    $("records").innerHTML='<div class="empty">No practices found.</div>';
    return;
  }
  $("records").innerHTML=state.rows.map(p=>`
    <article class="record ${state.selected?.id===p.id?"selected":""}" data-id="${esc(p.id)}">
      <div class="record-top">
        <div><h3>${esc(p.name)}</h3><div class="address">${esc(p.address||p.postcode)}</div></div>
        <span class="email-count">${p.contacts?.length?`✉ ${p.contacts.length}`:"No email"}</span>
      </div>
      <div class="badges">${badge(p.status)}${p.region?`<span class="badge">${esc(p.region)}</span>`:""}</div>
    </article>`).join("");
  document.querySelectorAll(".record").forEach(el=>el.onclick=()=>{
    state.selected=state.rows.find(p=>p.id===el.dataset.id);
    renderRows();
    renderDetail();
  });
}

function renderDetail(){
  const p=state.selected;
  if(!p){
    $("detail").innerHTML='<div class="empty">Select a practice to view its contacts.</div>';
    return;
  }

  $("addTop").disabled=false;
  $("detail").innerHTML=`
    <div class="detail">
      <div class="detail-title">
        <div><h2>${esc(p.name)}</h2><p>${esc(p.address)}</p></div>
        ${badge(p.status)}
      </div>
      <div class="divider"></div>
      <h3 class="section-title">CQC details</h3>
      <div class="data">
        <div><div class="data-label">Location ID</div><div class="data-value">${esc(p.id)}</div></div>
        <div><div class="data-label">Registration</div><div class="data-value">${esc(p.status||"—")}</div></div>
        <div><div class="data-label">Region</div><div class="data-value">${esc(p.region||"—")}</div></div>
        <div><div class="data-label">Local authority</div><div class="data-value">${esc(p.localAuthority||"—")}</div></div>
        <div><div class="data-label">Phone</div><div class="data-value">${esc(p.phone||"—")}</div></div>
        <div><div class="data-label">CQC record</div><div class="data-value"><a target="_blank" rel="noreferrer" href="${esc(p.cqcUrl)}">Open ↗</a></div></div>
      </div>
      <div class="divider"></div>
      <div class="panel-head" style="padding:0 0 9px;border:0">
        <h3 class="section-title" style="margin:0">Email contacts</h3>
        <button class="button small primary" id="addHere">＋ Add</button>
      </div>
      <div class="contacts">
        ${(p.contacts||[]).length?p.contacts.map(c=>`
          <div class="contact">
            <div class="contact-top">
              <span class="contact-role">${esc(c.role)}</span>
              <div class="contact-actions">
                <button class="button small copy" data-email="${esc(c.email)}">Copy</button>
                <button class="button small edit" data-id="${esc(c.id)}">Edit</button>
                <button class="button small danger remove" data-id="${esc(c.id)}">Delete</button>
              </div>
            </div>
            <a class="email-link" href="mailto:${esc(c.email)}">${esc(c.email)}</a>
            ${c.note?`<div class="contact-note">${esc(c.note)}</div>`:""}
            <div class="source">Source: ${esc(c.source)} · Added by ${esc(c.created_by)} · ${new Date(c.created_at).toLocaleString()}</div>
          </div>`).join(""):'<div class="empty" style="border:1px dashed var(--line);border-radius:7px;padding:15px">No email contacts recorded.</div>'}
      </div>
      <div class="divider"></div>
      <div class="panel-head" style="padding:0 0 9px;border:0">
        <h3 class="section-title" style="margin:0">Recent activity</h3>
        <button class="button small" id="viewActivity">View all</button>
      </div>
      <div class="activity" id="recentActivity"><div class="empty">Loading activity…</div></div>
    </div>`;

  $("addHere").onclick=()=>openModal();
  $("viewActivity").onclick=()=>showView("activity");
  document.querySelectorAll(".copy").forEach(b=>b.onclick=async()=>{
    try{await navigator.clipboard.writeText(b.dataset.email);toast("Copied")}
    catch{toast("Clipboard access unavailable")}
  });
  document.querySelectorAll(".edit").forEach(b=>b.onclick=()=>{
    const contact=p.contacts.find(x=>x.id===b.dataset.id);
    openModal(contact);
  });
  document.querySelectorAll(".remove").forEach(b=>b.onclick=async()=>{
    const contact=p.contacts.find(x=>x.id===b.dataset.id);
    if(!confirm(`Delete ${contact.email}?`))return;
    try{
      await api(`/api/contacts/${encodeURIComponent(contact.id)}`,{method:"DELETE"});
      toast("Contact deleted");
      await loadPractices();
    }catch(e){showError(e.message)}
  });
  loadActivity(true);
}

async function loadActivity(recent=false){
  try{
    const data=await api("/api/activity?limit="+(recent?5:100));
    const list=recent?$("recentActivity"):$("activityList");
    if(!list)return;
    list.innerHTML=data.activity.length?data.activity.map(a=>`
      <div class="activity-item">
        <div class="avatar">${esc(a.actor_email.slice(0,2).toUpperCase())}</div>
        <div class="activity-copy"><strong>${esc(a.actor_email)}</strong> ${esc(a.action)} <strong>${esc(a.practice_name)}</strong>
          <small>${esc(a.details)} · ${new Date(a.created_at).toLocaleString()}</small>
        </div>
      </div>`).join(""):'<div class="empty">No activity yet.</div>';
  }catch(e){
    if(recent&&$("recentActivity"))$("recentActivity").innerHTML=`<div class="empty">${esc(e.message)}</div>`;
    else if($("activityList"))$("activityList").innerHTML=`<div class="empty">${esc(e.message)}</div>`;
  }
}

function showView(view){
  state.view=view;
  $("directoryView").hidden=view!=="directory";
  $("activityView").hidden=view!=="activity";
  $("pageTitle").textContent=view==="directory"?"Dental practices":"Team activity";
  $("directoryTab").classList.toggle("active",view==="directory");
  $("activityTab").classList.toggle("active",view==="activity");
  $("addTop").style.display=view==="directory"?"":"none";
  if(view==="activity")loadActivity();
}

function openModal(contact=null){
  if(!state.selected)return;
  $("contactId").value=contact?.id||"";
  $("email").value=contact?.email||"";
  $("role").value=contact?.role||"Reception";
  $("source").value=contact?.source||"";
  $("note").value=contact?.note||"";
  $("modalTitle").textContent=contact?"Edit email contact":"Add email contact";
  $("backdrop").classList.add("open");
  $("email").focus();
}

function closeModal(){
  $("backdrop").classList.remove("open");
  $("contactForm").reset();
}

function toast(text){
  const t=$("toast");
  t.textContent=text;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),1600);
}

$("contactForm").onsubmit=async e=>{
  e.preventDefault();
  if(!state.selected)return;
  const id=$("contactId").value;
  const body={
    locationId:state.selected.id,
    practiceName:state.selected.name,
    email:$("email").value,
    role:$("role").value,
    source:$("source").value,
    note:$("note").value
  };
  try{
    await api(id?`/api/contacts/${encodeURIComponent(id)}`:"/api/contacts",{
      method:id?"PUT":"POST",
      body:JSON.stringify(body)
    });
    closeModal();
    toast(id?"Contact updated":"Contact added");
    await loadPractices();
  }catch(e){showError(e.message)}
};

$("addTop").onclick=()=>openModal();
$("closeModal").onclick=closeModal;
$("cancelModal").onclick=closeModal;
$("backdrop").onclick=e=>{if(e.target.id==="backdrop")closeModal()};
document.onkeydown=e=>{if(e.key==="Escape")closeModal()};
$("directoryTab").onclick=()=>showView("directory");
$("activityTab").onclick=()=>showView("activity");
$("prevPage").onclick=()=>{if(state.page>1){state.page--;loadPractices()}};
$("nextPage").onclick=()=>{state.page++;loadPractices()};
$("clearFilters").onclick=()=>{
  $("q").value="";
  $("region").value="";
  $("localAuthority").value="";
  $("emailFilter").value="";
  state.page=1;
  loadPractices();
};

for(const id of ["q","region","localAuthority","emailFilter"]){
  $(id).addEventListener(id==="q"||id==="localAuthority"?"input":"change",()=>{
    clearTimeout(state.timer);
    state.timer=setTimeout(()=>{
      state.page=1;
      loadPractices();
    },id==="q"||id==="localAuthority"?450:0);
  });
}

$("exportBtn").onclick=()=>{
  const lines=[
    ["Practice","Address","Postcode","Region","Local authority","Registration","Email","Role","Source"],
    ...state.rows.flatMap(p=>p.contacts.length
      ?p.contacts.map(c=>[p.name,p.address,p.postcode,p.region,p.localAuthority,p.status,c.email,c.role,c.source])
      :[[p.name,p.address,p.postcode,p.region,p.localAuthority,p.status,"","",""]])
  ];
  const csv=lines.map(row=>row.map(v=>'"'+String(v??"").replaceAll('"','""')+'"').join(",")).join("\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
  a.download="dental-practices.csv";
  a.click();
  URL.revokeObjectURL(a.href);
};

loadUser();
loadPractices();
</script>
</body>
</html>
